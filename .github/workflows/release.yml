name: Publish release

# workflow 定义位于默认分支 main；release 分支只含部署白名单内容，
# 因此不能用 push: branches:[release] 触发（GitHub 从被推送的 ref 读取 workflow 文件）。
# 改由 scripts/sync-release.mjs --push 派发 repository_dispatch，
# 本 workflow 在 main 上运行，用脚本算版本号，再 archive release HEAD 打包。
on:
  repository_dispatch:
    types: [release-publish]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview the next version and file list without publishing'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve release HEAD
        id: rel
        run: |
          if ! git ls-remote --exit-code --heads origin refs/heads/release >/dev/null 2>&1; then
            echo "::error::release branch does not exist; run scripts/sync-release.mjs --push first"
            exit 1
          fi
          git fetch origin refs/heads/release:refs/remotes/origin/release --force
          SHA=$(git rev-parse refs/remotes/origin/release)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "release HEAD: $SHA"

      - name: Fetch tags and git identity
        run: |
          git fetch --tags --force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Compute version
        id: ver
        run: |
          NEXT=$(node scripts/next-version.mjs)
          CURRENT=$(node scripts/next-version.mjs --current)
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "Next version: $NEXT (current: ${CURRENT:-none})"

      - name: Idempotency guard
        id: guard
        run: |
          SHA="${{ steps.rel.outputs.sha }}"
          if git tag --points-at "$SHA" | grep -q .; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "release HEAD is already tagged; nothing to publish."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Dry run
        if: ${{ inputs.dry_run == true || steps.guard.outputs.skip == 'true' }}
        run: |
          echo "Would publish ${{ steps.ver.outputs.next }} from ${{ steps.rel.outputs.sha }}"
          git ls-tree -r --name-only "${{ steps.rel.outputs.sha }}"

      - name: Build archives
        if: ${{ inputs.dry_run != true && steps.guard.outputs.skip != 'true' }}
        run: |
          V="${{ steps.ver.outputs.next }}"
          D="sponsor-me-$V"
          SHA="${{ steps.rel.outputs.sha }}"
          mkdir -p "dist/$D"
          git archive "$SHA" | tar -x -C "dist/$D"
          printf '%s\n' "$V" > "dist/$D/VERSION"
          (cd dist && zip -qr "../$D.zip" "$D")
          (cd dist && tar -czf "../$D.tar.gz" "$D")
          sha256sum "$D.zip" "$D.tar.gz" > SHA256SUMS
          echo "Built $D.zip and $D.tar.gz from release HEAD $SHA"

      - name: Release notes
        if: ${{ inputs.dry_run != true && steps.guard.outputs.skip != 'true' }}
        run: |
          PREV="${{ steps.ver.outputs.current }}"
          SHA="${{ steps.rel.outputs.sha }}"
          if [ -n "$PREV" ] && git rev-parse -q --verify "refs/tags/$PREV" >/dev/null; then
            git log --oneline "$PREV".."$SHA" > notes.txt
          else
            printf 'Initial release.\n' > notes.txt
          fi

      - name: Publish
        if: ${{ inputs.dry_run != true && steps.guard.outputs.skip != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="${{ steps.ver.outputs.next }}"
          D="sponsor-me-$V"
          SHA="${{ steps.rel.outputs.sha }}"
          gh release create "$V" --target "$SHA" --title "$V" --notes-file notes.txt --draft
          gh release upload "$V" "$D.zip" "$D.tar.gz" SHA256SUMS --clobber
          gh release edit "$V" --draft=false

      - name: Cleanup on failure
        if: ${{ failure() && inputs.dry_run != true && steps.guard.outputs.skip != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="${{ steps.ver.outputs.next }}"
          gh release delete "$V" --yes --cleanup-tag || true
