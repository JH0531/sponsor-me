<!doctype html>
<html lang="zh-Hans" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff5e2">
<meta name="description" content="请作者喝一杯，或者赞助点别的。">
<title>请作者喝一杯</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='88'%3E%E2%98%95%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>

<main id="stage" data-state="boot" data-channel="picker" data-busy="0">

  <div class="bg" aria-hidden="true">
    <div class="bg__warm"></div>
    <div class="bg__vignette"></div>
  </div>

  <div class="dm dm--back" id="dmBack" aria-hidden="true"></div>

  <div class="body">

    <!-- ══════════ 入口 ══════════ -->
    <section class="scene scene--idle" id="sceneIdle">

      <div class="hero" id="hero">

        <div class="halo" aria-hidden="true">
          <div class="halo__light">
            <div class="halo__glow"></div>
            <div class="halo__rays"></div>
          </div>
        </div>

        <button class="hero__hit" id="heroHit" type="button">
          <span class="hero__breathe">
            <span class="hero__lift">
              <span class="hero__drop">
                <span class="hero__pop">
                  <span class="hero__hover">
                    <span class="hero__stage" id="heroStage" aria-hidden="true"></span>
                  </span>
                  <span class="pop-ring" id="popRing" aria-hidden="true"></span>
                </span>
              </span>
            </span>
          </span>
        </button>

        <div class="finger" id="finger" aria-hidden="true">
          <div class="finger__bob">
            <div class="finger__art" id="fingerArt"></div>
          </div>
        </div>

      </div>

      <div class="idle__foot">
        <p class="idle__caption" id="caption">
          <svg class="cap__ico" viewBox="0 0 24 24" aria-hidden="true" fill="none"
               stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m17 11-5-5-5 5"/><path d="m17 18-5-5-5 5"/>
          </svg>
          <span id="captionText"></span>
          <svg class="cap__ico" viewBox="0 0 24 24" aria-hidden="true" fill="none"
               stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m17 11-5-5-5 5"/><path d="m17 18-5-5-5 5"/>
          </svg>
        </p>
        <p class="idle__blurb" id="blurb"></p>
      </div>

    </section>

    <!-- ══════════ 打赏 ══════════ -->
    <section class="scene scene--channel" id="sceneChannel" aria-hidden="true">
      <div class="ch__stage">
        <div class="card" id="card">
          <div class="card__face" id="cardFace"></div>
        </div>
      </div>
    </section>

  </div>

  <div class="dm dm--front" id="dmFront" aria-hidden="true"></div>

  <!-- ══════════ 底部：控制条 + 仓库链接，三个界面常驻 ══════════ -->
  <div class="footer">

    <div class="dock">

      <div class="dock__slot">
        <button class="icon-btn" id="langBtn" type="button" aria-haspopup="listbox" aria-expanded="false">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor"
               stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="m5 8 6 6"/><path d="m4 14 6-6 2-3"/><path d="M2 5h12"/><path d="M7 2h1"/>
            <path d="m22 22-5-10-5 10"/><path d="M14 18h6"/>
          </svg>
        </button>

        <div class="lang-menu" id="langMenu" role="listbox" aria-hidden="true">
          <button class="lang-menu__item" type="button" role="option" data-lang="zh-Hans">中文（简体）</button>
          <button class="lang-menu__item" type="button" role="option" data-lang="en">English</button>
        </div>
      </div>

      <button class="pill" id="mainBtn" type="button">
        <span class="pill__label" id="mainBtnLabel"></span>
      </button>

      <div class="dock__slot">
        <button class="icon-btn" id="themeBtn" type="button">
          <svg class="icon-btn__moon" viewBox="0 0 24 24" aria-hidden="true" fill="none"
               stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
          </svg>
          <svg class="icon-btn__sun" viewBox="0 0 24 24" aria-hidden="true" fill="none"
               stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
          </svg>
        </button>
      </div>

    </div>

    <a class="repo" id="repoLink" target="_blank" rel="noopener noreferrer">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8a8 8 0 0 0 5.47 7.59c.4.07.55-.17.55-.38l-.01-1.49c-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.4 7.4 0 0 1 4 0c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48l-.01 2.2c0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
      <span id="repoText">本库 GitHub</span>
    </a>

  </div>

  <canvas class="fx" id="fx" aria-hidden="true"></canvas>

</main>

<script src="assets/vendor/lottie_light.min.js" defer></script>
<script src="assets/config.js" defer></script>
<script src="assets/app.js" defer></script>
</body>
</html>
